version: '3.8'

services:
  # MongoDB 7.0 Service with Persistent Volume
  mongodb:
    image: mongo:7.0
    container_name: inquiry-mongodb
    restart: always
    ports:
      # Expose only to localhost on the host machine for security
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Backend Node.js / Express API Service
  backend-api:
    image: ${DOCKERHUB_USERNAME:-japleen}/inquiry-backend:latest
    container_name: inquiry-backend-api
    restart: always
    ports:
      # Exposes port 5000 to accept requests from Frontend EC2
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/inquiry_db
      - ALLOWED_ORIGINS=http://13.214.151.97,http://13.214.151.97:8080,http://localhost,http://localhost:8080
      - NODE_ENV=production
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - backend-net

volumes:
  mongo_data:
    driver: local

networks:
  backend-net:
    driver: bridge
