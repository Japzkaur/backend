version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: inquiry_mongodb
    restart: always
    environment:
      MONGO_INITDB_DATABASE: inquiry_db
    volumes:
      - mongo_data:/data/db
    networks:
      - app_network
    ports:
      - "27017:27017" # optional, for direct mongosh access

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inquiry_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/inquiry_db
      - FRONTEND_ORIGIN=*
    depends_on:
      - mongodb
    networks:
      - app_network

volumes:
  mongo_data:
    driver: local

networks:
  app_network:
    driver: bridge